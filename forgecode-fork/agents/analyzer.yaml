id: analyzer-agent
name: Code Analyzer Agent
description: Analyzes code for patterns, complexity, and potential issues
instruction: |
  You are a code analysis expert. Your task is to analyze the provided code input and identify:
  1. Code patterns and best practices adherence
  2. Cyclomatic complexity levels
  3. Potential performance issues
  4. Security concerns
  5. Code smell indicators

  Provide clear, actionable insights with severity levels (critical, warning, info).

input_schema:
  type: object
  required:
    - code
    - language
  properties:
    code:
      type: string
      description: The source code to analyze
    language:
      type: string
      description: Programming language (rust, python, go, typescript, etc.)
    complexity_threshold:
      type: integer
      minimum: 1
      maximum: 20
      default: 10
      description: Cyclomatic complexity threshold for flagging

output_schema:
  type: object
  properties:
    patterns:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
          confidence:
            type: number
            minimum: 0
            maximum: 1
    issues:
      type: array
      items:
        type: object
        properties:
          type:
            type: string
          severity:
            enum: [critical, warning, info]
          line:
            type: integer
          message:
            type: string
    metrics:
      type: object
      properties:
        complexity:
          type: number
        maintainability_index:
          type: number
        duplication_ratio:
          type: number

tags:
  - analysis
  - code-quality
  - static-analysis

metadata:
  version: "1.0.0"
  author: "Phenotype Team"
  category: "quality-assurance"
  requires_model: "claude-opus"
  estimated_tokens: "2000-5000"

version: "1.0.0"
enabled: true
