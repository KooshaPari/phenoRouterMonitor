<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="phenoRouterMonitor">
  <title>phenoRouterMonitor</title>
  <desc>AI-coded vector mark: a semicircular signal gauge with a needle and routing nodes, for LLM router monitoring. Hand-authored paths.</desc>
  <defs>
    <linearGradient id="prm-bg" x1="24" y1="24" x2="488" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#14203A"/>
    </linearGradient>
    <linearGradient id="prm-arc" x1="120" y1="320" x2="392" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="0.5" stop-color="#EAB308"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#prm-bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="none" stroke="#27406B" stroke-width="2"/>

  <!-- Gauge arc (green->yellow->red) -->
  <path d="M 132 320 A 124 124 0 0 1 380 320" fill="none" stroke="url(#prm-arc)" stroke-width="30" stroke-linecap="round"/>

  <!-- Tick marks -->
  <g stroke="#7FA0C9" stroke-width="6" stroke-linecap="round">
    <path d="M 146 250 L 162 262"/>
    <path d="M 256 196 L 256 216"/>
    <path d="M 366 250 L 350 262"/>
  </g>

  <!-- Needle pointing up-right -->
  <path d="M 256 320 L 326 232" fill="none" stroke="#E2E8F0" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="320" r="22" fill="#E2E8F0"/>
  <circle cx="256" cy="320" r="10" fill="#0B1220"/>

  <!-- Routing nodes feeding the monitor -->
  <g fill="#38BDF8">
    <circle cx="160" cy="392" r="16"/>
    <circle cx="256" cy="416" r="16"/>
    <circle cx="352" cy="392" r="16"/>
  </g>
  <g stroke="#38BDF8" stroke-width="6" opacity="0.7">
    <path d="M 160 392 L 240 340"/>
    <path d="M 256 416 L 256 344"/>
    <path d="M 352 392 L 272 340"/>
  </g>
</svg>
