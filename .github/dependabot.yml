# phenotype-infrakit — Dependabot configuration
# https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  # ── Rust (Cargo) ─────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  # ── GitHub Actions ───────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    labels:
      - ci
      - automated
    commit-message:
      prefix: ci
      include: scope
