name: Auto Merge PR

on:
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Approve PR
        run: |
          gh pr review ${{ github.event.inputs.pr_number }} --approve
          gh pr merge ${{ github.event.inputs.pr_number }} --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
