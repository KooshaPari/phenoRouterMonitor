name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Build Release Binaries ───────────────────────────────────────────
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: x86_64-apple-darwin
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-apple-darwin
            os: ubuntu-latest
            use_cross: true
    steps:
      - uses: ./.github/actions/setup-env
        with:
          rust-version: stable
          setup-protoc: 'true'

      - uses: ./.github/actions/build-rust-binary
        with:
          target: ${{ matrix.target }}
          use-cross: ${{ matrix.use_cross }}
          binary-name: agileplus
          artifact-name: agileplus-${{ matrix.target }}
          strip-binary: 'true'

  # ─── Create GitHub Release ────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write
    steps:
      - uses: ./.github/actions/setup-env
        with:
          checkout-depth: '0'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries
      - name: Prepare release assets
        run: |
          mkdir -p ./release-assets
          for target_dir in ./binaries/*/; do
            target_name=$(basename "$target_dir")
            binary_path="$target_dir/agileplus"
            if [ -f "$binary_path" ]; then
              cp "$binary_path" "./release-assets/agileplus-${target_name}"
            fi
          done
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./release-assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          generateReleaseNotes: true
