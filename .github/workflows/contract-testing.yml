name: Contract Testing

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/*pact*'
      - '**/pacts/**'
      - '**/contracts/**'
  workflow_dispatch:

jobs:
  pact-provider:
    name: Pact Provider Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Pact Rust
        run: |
          cargo install pact_consumer || true
          cargo install pact_server || true

      - name: Run Pact provider tests
        run: |
          if [ -f "pacts/provider_test.rs" ]; then
            cargo test --package pact_tests 2>/dev/null || echo "No pact tests"
          fi

      - name: Publish to Pact Broker
        if: github.ref == 'refs/heads/main'
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          if [ -n "$PACT_BROKER_URL" ]; then
            curl -X PUT "$PACT_BROKER_URL/pacts/provider/${{ github.event.repository.name }}/version/${{ github.sha }}" \
              -H "Authorization: Bearer $PACT_BROKER_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
          fi

  pact-consumer:
    name: Pact Consumer Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Pact consumer tests
        run: |
          if [ -d "pacts/consumer" ]; then
            cargo test --package pact_tests 2>/dev/null || echo "No consumer pact tests"
          fi

  openapi-contract:
    name: OpenAPI Contract Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Dredd
        run: |
          npm install -g dredd

      - name: Validate API contracts
        run: |
          if [ -f "api/openapi.yaml" ]; then
            dredd api/openapi.yaml http://localhost:3000 --hookfiles=tests/hooks.js || true
          fi

      - name: Store results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dredd-results
          path: |
            dredd-results.html
            dredd-report.json
          retention-days: 7
