name: Supply Chain Security

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  sigstore-sign:
    name: Sigstore Cosign Sign
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Cosign
        uses: sigstore/cosign-installer@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build artifact
        run: |
          go build -o artifact ./cmd/app

      - name: Sign and publish
        env:
          COSIGN_EXPERIMENTAL: 1
          COSIGN_YES: true
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Verify
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign verify ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  slsa-verifier:
    name: SLSA Provenance Verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up SLSA verifier
        run: |
          curl -sSfL https://github.com/slsa-framework/slsa-verifier/releases/download/v2.1.0/slsa-verifier-linux-amd64 -o /usr/local/bin/slsa-verifier
          chmod +x /usr/local/bin/slsa-verifier

      - name: Verify provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          slsa-verifier verify-artifact \
            --organisation "${{ github.event.repository.owner.login }}" \
            --repository "${{ github.event.repository.name }}" \
            --workflow-path ".github/workflows/release.yml" \
            --tag "${{ github.ref_name }}" \
            ./artifact

  hermes-signing:
    name: Hermes Image Signing
    runs-on: ubuntu-latest
    if: false # Enable for container images
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build and sign image
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
          cosign sign --yes ghcr.io/${{ github.repository }}:${{ github.sha }}

  tuf-security:
    name: TUF Metadata Verification
    runs-on: ubuntu-latest
    if: false # Enable for secure artifact distribution
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify with TUF
        run: |
          # Implement TUF verification for artifact updates
          echo "TUF verification not yet configured"
