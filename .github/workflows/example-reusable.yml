name: Example Reusable Workflow Usage

on:
  push:
    branches: [main]

jobs:
  # Example 1: Using reusable Rust quality workflow
  rust-quality:
    uses: ./.github/workflows/reusable/rust-quality.yml
    with:
      rust-version: nightly
      coverage-threshold: 85
      working-directory: .

  # Example 2: Using reusable security scan
  security-scan:
    uses: ./.github/workflows/reusable/security-scan.yml
    with:
      cargo-audit: "true"
      cargo-deny: "true"
      gitleaks: "true"
      working-directory: .

  # Example 3: Using reusable release build
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/reusable/rust-release.yml
    with:
      rust-version: stable
      targets: "x86_64-unknown-linux-gnu,aarch64-apple-darwin"
