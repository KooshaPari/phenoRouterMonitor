name: Cross-Project AI Testing Orchestration

on:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Projects to test'
        required: true
        default: 'nanovms,agileplus,thegent'
        type: string
  schedule:
    - cron: '0 5 * * 0'  # Weekly cross-project

env:
  QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
  APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
  TESTRIGOR_API_KEY: ${{ secrets.TESTRIGOR_API_KEY }}

jobs:
  orchestration:
    name: AI Testing Orchestration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read MCP Config
        run: |
          echo "Cross-project MCP configuration:"
          cat .mcp-testing.yaml | head -30

      - name: List MCP Servers
        run: |
          echo "Configured MCP servers:"
          grep -E "^\s+[a-z]+:" .mcp-testing.yaml | head -10

  nanovms:
    name: NanoVMS Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nanovms
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KooshaPari/nanovms
          path: nanovms

      - name: Run NanoVMS Tests
        run: |
          echo "NanoVMS AI testing configured"
          echo "  - BDD tests: $(ls tests/bdd/*.feature 2>/dev/null | wc -l) features"
          echo "  - Playwright MCP: configured"
          echo "  - Qodo: configured"

  agileplus:
    name: AgilePlus Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgilePlus
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KooshaPari/AgilePlus
          path: AgilePlus

      - name: Run AgilePlus Tests
        run: |
          echo "AgilePlus AI testing configured"
          echo "  - Applitools: configured"
          echo "  - TestRigor: $(grep -c 'tests:' testrigor.spec.yaml 2>/dev/null || echo 0) test suites"
          echo "  - Self-healing: configured"

  thegent:
    name: thegent Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thegent
    steps:
      - uses: actions/checkout@v4
        with:
          repository: KooshaPari/thegent
          path: thegent

      - name: Run thegent Tests
        run: |
          echo "thegent AI testing configured"
          echo "  - KaneAI: $(ls tests/kaneai/*.yaml 2>/dev/null | wc -l) scenarios"
          echo "  - Visual TUI: $(ls tests/visual/*.py 2>/dev/null | wc -l) test files"
          echo "  - Qodo: configured"

  aggregate-results:
    name: Aggregate Results
    runs-on: ubuntu-latest
    needs: [nanovms, agileplus, thegent]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Cross-Project AI Testing Summary"
          echo ""
          echo "| Project | Status |"
          echo "|---------|--------|"
          echo "| NanoVMS | ${{ needs.nanovms.result == 'success' && '✅' || '❌' }} |"
          echo "| AgilePlus | ${{ needs.agileplus.result == 'success' && '✅' || '❌' }} |"
          echo "| thegent | ${{ needs.thegent.result == 'success' && '✅' || '❌' }} |"
