name: Actions Validation

on:
  push:
    paths:
      - '.github/actions/**'
      - '.github/workflows/actions-validation.yml'
  pull_request:
    paths:
      - '.github/actions/**'
      - '.github/workflows/actions-validation.yml'

jobs:
  validate-setup-env:
    name: Validate setup-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
        with:
          rust-version: stable
          setup-protoc: "false"

  validate-run-tests:
    name: Validate run-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - uses: ././github/actions/run-tests
        with:
          test-command: cargo test --lib
          working-directory: crates/phenotype-contracts

  validate-security-checks:
    name: Validate security-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ././github/actions/setup-env
      - uses: ././github/actions/security-checks
        with:
          cargo-audit: "false"
          cargo-deny: "false"
          gitleaks: "true"
