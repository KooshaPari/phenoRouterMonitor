name: Build Rust Binary
description: Builds Rust binaries with cross-compilation support.

inputs:
  binary-name:
    description: Binary name
    default: ${{ github.event.repository.name }}
    required: false
  target:
    description: Build target
    default: ""
    required: false
  release:
    description: Build in release mode
    default: "true"
    required: false
  strip:
    description: Strip binary
    default: "false"
    required: false
  working-directory:
    description: Working directory
    default: .
    required: false

runs:
  using: composite
  steps:
    - name: Build
      shell: bash
      run: |
        cd ${{ inputs.working-directory }}
        PROFILE=""
        if [ "${{ inputs.release }}" == "true" ]; then
          PROFILE="--release"
        fi
        TARGET=""
        if [ "${{ inputs.target }}" != "" ]; then
          TARGET="--target ${{ inputs.target }}"
        fi
        cargo build $PROFILE $TARGET

    - name: Strip
      if: inputs.strip == 'true'
      shell: bash
      run: |
        cd ${{ inputs.working-directory }}
        find target -name "${{ inputs.binary-name }}" -type f -executable -exec strip {} \;

    - name: Package
      shell: bash
      run: |
        cd ${{ inputs.working-directory }}
        EXT=""
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          EXT=".exe"
        fi
        TARGET_DIR="target/release"
        if [ "${{ inputs.target }}" != "" ]; then
          TARGET_DIR="target/${{ inputs.target }}/release"
        fi
        tar -czf ${{ inputs.binary-name }}.tar.gz -C $TARGET_DIR ${{ inputs.binary-name }}$EXT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.binary-name }}-${{ runner.os }}
        path: ${{ inputs.working-directory }}/${{ inputs.binary-name }}.tar.gz
