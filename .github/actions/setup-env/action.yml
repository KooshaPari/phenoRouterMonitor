name: Setup Environment
description: Sets up Rust toolchain, caching, and optional protoc.

inputs:
  rust-version:
    description: Rust version (stable, nightly, or version number)
    default: stable
    required: false
  rust-components:
    description: Additional Rust components (comma-separated)
    default: ""
    required: false
  setup-protoc:
    description: Install protoc
    default: "false"
    required: false
  checkout-depth:
    description: Git fetch depth
    default: "1"
    required: false
  workspace:
    description: Workspace path for caching
    default: "."
    required: false

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.checkout-depth }}

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.rust-version }}
        components: rustfmt, clippy ${{ inputs.rust-components }}

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.workspace }}

    - name: Setup protoc
      if: inputs.setup-protoc == 'true'
      uses: arduino/setup-protoc@v3
      with:
        version: "28.x"
