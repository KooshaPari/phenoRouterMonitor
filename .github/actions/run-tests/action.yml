name: Run Tests
description: Run Rust tests and linting (cargo test, cargo clippy)

inputs:
  test-command:
    description: Custom test command (overrides default)
    required: false
    default: 'cargo test --all'
  lint-command:
    description: Custom lint command (overrides default)
    required: false
    default: 'cargo clippy -- -D warnings'
  skip-lint:
    description: Skip clippy linting
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Run tests
      run: ${{ inputs.test-command }}
      shell: bash

    - name: Run linter (clippy)
      if: inputs.skip-lint == 'false'
      run: ${{ inputs.lint-command }}
      shell: bash
