agileplus_version: "1.0.0"
project:
  name: "phenotype-auth-ts"
  description: "TypeScript authentication and authorization SDK for Phenotype ecosystem"
  repository: "https://github.com/KooshaPari/phenotype-auth-ts"
  spec_format: "yaml"

specs:
  architecture_decisions:
    - id: "adr_001"
      title: "OAuth 2.0 / OIDC Standard Compliance"
      status: "accepted"
    - id: "adr_002"
      title: "JWT Token Management with Refresh Rotation"
      status: "accepted"
    - id: "adr_003"
      title: "RBAC with Policy-Based Access Control"
      status: "accepted"
    - id: "adr_004"
      title: "WebAuthn / Passkey Support"
      status: "proposed"
  
  functional_requirements:
    - id: "fr_001"
      title: "User Authentication (Login/Logout)"
      status: "implemented"
      priority: "high"
    - id: "fr_002"
      title: "Token Management (JWT, Refresh)"
      status: "implemented"
      priority: "high"
    - id: "fr_003"
      title: "Role-Based Access Control (RBAC)"
      status: "implemented"
      priority: "high"
    - id: "fr_004"
      title: "Multi-Factor Authentication (MFA)"
      status: "implemented"
      priority: "medium"
    - id: "fr_005"
      title: "Session Management"
      status: "implemented"
      priority: "medium"
    - id: "fr_006"
      title: "WebAuthn / Passkey Authentication"
      status: "proposed"
      priority: "low"
  
  user_stories:
    - id: "us_001"
      title: "Login with Username/Password"
      status: "implemented"
      priority: "high"
    - id: "us_002"
      title: "Refresh Expired Tokens"
      status: "implemented"
      priority: "high"
    - id: "us_003"
      title: "Enforce Role Permissions"
      status: "implemented"
      priority: "high"

metadata:
  last_updated: "2026-04-03"
  author: "Phenotype Team"
  license: "MIT"
