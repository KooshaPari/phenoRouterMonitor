[package]
name = "phenotype-infrakit"
version = "0.2.0"
edition = "2021"
authors = ["Phenotype Developers"]
description = "Phenotype Infrastructure Kit"
license = "MIT"

[workspace]
resolver = "2"
members = [
    "crates/phenotype-bdd",
    "crates/phenotype-compliance-scanner",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
toml = "0.8"
dashmap = "5.5"
tempfile = "3"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
