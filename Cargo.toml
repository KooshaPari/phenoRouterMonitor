[workspace]
resolver = "2"
members = [
    "crates/phenotype-error-core",
    "crates/phenotype-errors",
    "crates/phenotype-contracts",
    "crates/phenotype-health",
    "crates/phenotype-port-traits",
    "crates/phenotype-policy-engine",
    "crates/phenotype-telemetry",
    "crates/phenotype-state-machine",
    "crates/phenotype-cache-adapter",
    "crates/phenotype-config-core",
    "crates/phenotype-iter",
    "crates/phenotype-logging",
    "crates/phenotype-rate-limit",
    "crates/phenotype-string",
    "crates/phenotype-time",
    "crates/phenotype-retry",
    "crates/phenotype-git-core",
    "crates/phenotype-validation",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.81"
authors = ["Phenotype Team <team@phenotype.dev>"]
repository = "https://github.com/KooshaPari/phenotype-infrakit"
description = "Infrastructure components for the Phenotype ecosystem"
keywords = ["llm", "routing", "proxy", "monitoring"]
categories = ["Software Development", "Network Programming"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
futures-util = "0.3"
futures = "0.3"
tonic = { version = "0.13", features = ["transport"] }
tonic-build = { version = "0.13", features = ["prost"] }
prost = "0.13"
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
time = ">=0.3.49"
trait-variant = "0.1"
async-trait = "0.1"
toml = "0.8"
serde_yaml = "0.9"
figment = "0.10"
dirs = "5.0"
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "5"
lru = "0.12"
moka = { version = "0.12", features = ["sync"] }
regex = "1"
slog = "2"
slog-json = "2"
once_cell = "1"
parking_lot = "0.12"
schemars = "0.8"
jsonschema = "0.18"
gix = "0.71"
reqwest = { version = "0.12", features = ["json"] }
phenotype-error-core = { version = "0.2.0", path = "crates/phenotype-error-core" }
phenotype-errors = { version = "0.2.0", path = "crates/phenotype-errors" }
phenotype-contracts = { version = "0.2.0", path = "crates/phenotype-contracts" }
strum = { version = "0.26", features = ["derive"] }
tempfile = "3"

[profile.dev]
debug = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
