[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/phenotype-org/phenotype-infrakit"
description = "Phenotype Infrastructure Kit - Rust libraries for project management"

[package]
name = "phenotype-infrakit"
version.workspace = true
edition.workspace = true
description.workspace = true

[lib]
path = "src/lib.rs"

[workspace]
members = [
    "crates/phenotype-event-sourcing",
    "crates/phenotype-contracts",
    "crates/phenotype-cache-adapter",
    "crates/phenotype-policy-engine",
    "crates/phenotype-state-machine",
    "crates/phenotype-error-core",
    "crates/phenotype-errors",
    "crates/phenotype-logging",
    "crates/phenotype-telemetry",
    "crates/phenotype-config-core",
    "crates/phenotype-macros",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
dashmap = "5"
parking_lot = "0.12"
toml = "0.8"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json"] }
async-trait = "0.1"
anyhow = "1"
tokio = { version = "1.41", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
syn = "2"
quote = "1"
proc-macro2 = "1"
blake3 = "1"
