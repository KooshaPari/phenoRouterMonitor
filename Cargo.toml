[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
authors = ["Phenotype Team"]
repository = "https://github.com/KooshaPari/phenotype-infrakit"
description = "Phenotype Infrastructure Kit"

[workspace]
resolver = "2"
members = [
    "crates/phenotype-cache-adapter",
    "crates/phenotype-config-core",
    "crates/phenotype-contract",
    "crates/phenotype-contracts",
    "crates/phenotype-cost-core",
    "crates/phenotype-error-core",
    "crates/phenotype-errors",
    "crates/phenotype-git-core",
    "crates/phenotype-health",
    "crates/phenotype-iter",
    "crates/phenotype-logging",
    "crates/phenotype-policy-engine",
    "crates/phenotype-port-traits",
    "crates/phenotype-rate-limit",
    "crates/phenotype-state-machine",
    "crates/phenotype-telemetry",
    "crates/phenotype-time",
    "crates/phenotype-validation",
]

exclude = [
    "crates/phenotype-ports-canonical",
    "crates/bifrost-routing",
    "crates/forgecode-core",
    # Stubs - not ready for compilation
    "crates/phenotype-async-traits",
    "crates/phenotype-config-loader",
    "crates/phenotype-crypto",
    "crates/phenotype-error-macros",
    "crates/phenotype-event-sourcing",
    "crates/phenotype-http-client-core",
    "crates/phenotype-macros",
    "crates/phenotype-mcp",
    "crates/phenotype-process",
    "crates/phenotype-shared-config",
    "crates/phenotype-string",
    "crates/phenotype-test-infra",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1.5"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
dashmap = "5"
parking_lot = "0.12"
lru = "0.12"
moka = { version = "0.12", features = ["sync"] }
regex = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-opentelemetry = "0.32"
futures = "0.3"
futures-util = "0.3"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
tempfile = "3"
strum = { version = "0.26", features = ["derive"] }
once_cell = "1.19"
dirs = "5.0"
figment = { version = "0.10", features = ["toml", "yaml", "json", "env"] }
schemars = "0.8"
jsonschema = "0.18"
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
hmac = "0.12"
zeroize = "1.7"
ed25519-dalek = { version = "2.1", features = ["std"] }
gix = "0.71"
opentelemetry = { version = "0.31", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.31", features = ["trace", "metrics", "http-proto", "reqwest-client"] }
opentelemetry_sdk = { version = "0.31", features = ["trace", "metrics", "rt-tokio"] }
prometheus = "0.13"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
