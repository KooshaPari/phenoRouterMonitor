[package]
name = "phenotype-infrakit"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
license = "MIT"
authors = ["Phenotype Developers"]
description = "Phenotype Infrastructure Kit"

[workspace]
resolver = "2"
members = [
    "crates/phenotype-async-traits",
    "crates/phenotype-cache-adapter",
    "crates/phenotype-config-core",
    "crates/phenotype-contracts",
    "crates/phenotype-core",
    "crates/phenotype-error-core",
    "crates/phenotype-errors",
    "crates/phenotype-event-sourcing",
    "crates/phenotype-health",
    "crates/phenotype-port-traits",
    "crates/phenotype-state-machine",
    "crates/phenotype-string",
    "crates/phenotype-testing",
    "crates/phenotype-telemetry",
    "crates/phenotype-test-fixtures",
    "crates/phenotype-test-infra",
    "crates/phenotype-logging",
    "crates/phenotype-iter",
    "crates/phenotype-policy-engine",
    "crates/phenotype-bdd",
    "crates/phenotype-bid",
    "crates/phenotype-error-macros",
    "crates/phenotype-contract",
    "crates/phenotype-retry",
    "crates/phenotype-infrastructure",
    "crates/phenotype-metrics",
    "crates/phenotype-cache-adapter",
    "crates/phenotype-validation",
    "crates/phenotype-time",
    "crates/phenotype-iter",
    "crates/phenotype-string",
    "crates/phenotype-telemetry",
    "crates/phenotype-test-infra",
    "crates/phenotype-retry",
    "crates/phenotype-macros",
    "crates/phenotype-logging",
]
exclude = [
    "Apisync",
    "Benchora", 
    "BytePort",
]

[workspace.package]
edition = "2021"
version = "0.2.0"
rust-version = "1.75"
license = "MIT"
authors = ["Phenotype Developers <dev@phenotype.dev>"]

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
config = "0.14"
criterion = { version = "0.5", default-features = false }
crossbeam = "0.8"
dashmap = "6"
dirs = "5"
erased-serde = "0.4"
figment = { version = "0.10", features = ["toml"] }
futures = "0.3"
hdrhistogram = "7"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-util = "0.1"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
mime = "0.3"
mockall = "0.13"
nix = { version = "0.29", default-features = false }
notify = "7"
num_cpus = "1"
opentelemetry = "0.27"
opentelemetry-appender-tracing = "0.27"
opentelemetry-http = "0.27"
opentelemetry-otlp = { version = "0.27", default-features = false }
opentelemetry-semantic-conventions = "0.27"
opentelemetry-stdout = "0.27"
opentelemetry_sdk = { version = "0.27", default-features = false }
proptest = "1"
proc-macro2 = "1"
quote = "1"
syn = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sha2 = "0.10"
sha3 = "0.10"
similar = "2"
smallvec = "1"
strum = { version = "0.26", features = ["derive"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", default-features = false }
tokio = { version = "1", default-features = false }
tokio-rustls = "0.26"
tokio-stream = "0.1"
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-core = { version = "0.1", default-features = false }
tracing-log = "0.2"
tracing-opentelemetry = "0.28"
tracing-subscriber = { version = "0.3", default-features = false }
uuid = { version = "1", default-features = false }
parking_lot = "0.12"
lru = "0.16"
wiremock = "0.6"
tokio-test = "0.4"
phenotype-error-core = { version = "0.2.0", path = "crates/phenotype-error-core" }
phenotype-errors = { version = "0.2.0", path = "crates/phenotype-errors" }
phenotype-port-traits = { version = "0.2.0", path = "crates/phenotype-port-traits" }
phenotype-security-aggregator = { version = "0.1.0", path = "crates/phenotype-security-aggregator" }
phenotype-state-machine = { version = "0.2.0", path = "crates/phenotype-state-machine" }
phenotype-config-core = { version = "0.2.0", path = "crates/phenotype-config-core" }
phenotype-cache-adapter = { version = "0.2.0", path = "crates/phenotype-cache-adapter" }
phenotype-event-sourcing = { version = "0.2.0", path = "crates/phenotype-event-sourcing" }
phenotype-contracts = { version = "0.2.0", path = "crates/phenotype-contracts" }
phenotype-core = { version = "0.2.0", path = "crates/phenotype-core" }
phenotype-health = { version = "0.1.0", path = "crates/phenotype-health" }
phenotype-async-traits = { version = "0.2.0", path = "crates/phenotype-async-traits" }
phenotype-mock = { version = "0.2.0", path = "crates/phenotype-mock" }
phenotype-testing = { version = "0.2.0", path = "crates/phenotype-testing" }
phenotype-validation = { version = "0.2.0", path = "crates/phenotype-validation" }
phenotype-time = { version = "0.2.0", path = "crates/phenotype-time" }
phenotype-event-bus = { version = "0.2.0", path = "crates/phenotype-event-bus" }
phenotype-http-client-core = { version = "0.2.0", path = "crates/phenotype-http-client-core" }
phenotype-retry = { version = "0.2.0", path = "crates/phenotype-retry" }
phenotype-telemetry = { version = "0.2.0", path = "crates/phenotype-telemetry" }
phenotype-test-fixtures = { version = "0.2.0", path = "crates/phenotype-test-fixtures" }
phenotype-test-infra = { version = "0.2.0", path = "crates/phenotype-test-infra" }
phenotype-error-macros = { version = "0.2.0", path = "crates/phenotype-error-macros" }
phenotype-metrics = { version = "0.2.0", path = "crates/phenotype-metrics" }
phenotype-string = { version = "0.2.0", path = "crates/phenotype-string" }
phenotype-infrastructure = { version = "0.2.0", path = "crates/phenotype-infrastructure" }
phenotype-policy-engine = { version = "0.2.0", path = "crates/phenotype-policy-engine" }
phenotype-logging = { version = "0.2.0", path = "crates/phenotype-logging" }
phenotype-iter = { version = "0.2.0", path = "crates/phenotype-iter" }
phenotype-bdd = { version = "0.2.0", path = "crates/phenotype-bdd" }
phenotype-bid = { version = "0.2.0", path = "crates/phenotype-bid" }
phenotype-contract = { version = "0.2.0", path = "crates/phenotype-contract" }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
