[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
description = "Phenotype Infrastructure Kit"
authors = ["Phenotype Team"]
repository = "https://github.com/KooshaPari/phenotype-infrakit"

[workspace]
resolver = "2"
members = [
    "crates/phenotype-error-core",
    "crates/phenotype-errors",
    "crates/phenotype-contracts",
    "crates/phenotype-health",
    "crates/phenotype-port-traits",
    "crates/phenotype-policy-engine",
    "crates/phenotype-telemetry",
    "libs/phenotype-config-core",
    "forgecode-fork",
    "phenotype-router-monitor",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
blake3 = "1.5"
tokio = { version = "1", features = ["full"] }
dashmap = "5"
parking_lot = "0.12"
lru = "0.12"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
tracing-opentelemetry = "0.26"
opentelemetry = "0.25"
opentelemetry-otlp = "0.25"
opentelemetry_sdk = "0.25"
futures = "0.3"
futures-util = "0.3"
tempfile = "3"
strum = { version = "0.26", features = ["derive"] }
once_cell = "1.19"
gix = { version = "0.71", default-features = false, features = ["blocking-http-transport-curl", "blocking-network-client", "worktree-stream", "revision"] }
moka = { version = "0.12", features = ["sync"] }
figment = { version = "0.10", features = ["toml", "yaml", "env"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
dirs = "5.0"
num_cpus = "1.16"
phenotype-error-core = { version = "0.2.0", path = "crates/phenotype-error-core" }
phenotype-errors = { version = "0.2.0", path = "crates/phenotype-errors" }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
