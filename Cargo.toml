[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"
description = "Phenotype Infrastructure Kit"
authors = ["Phenotype Team"]
repository = "https://github.com/KooshaPari/phenotype-infrakit"

[workspace]
resolver = "2"
members = [
    "crates/phenotype-event-sourcing",
    "crates/phenotype-errors",
]

[package]
name = "phenotype-infrakit"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
phenotype-errors = { path = "crates/phenotype-errors" }

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
blake3 = "1.5"
dashmap = "5"
parking_lot = "0.12"
lru = "0.12"
regex = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
futures = "0.3"
syn = "2"
quote = "1"
proc-macro2 = "1"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
