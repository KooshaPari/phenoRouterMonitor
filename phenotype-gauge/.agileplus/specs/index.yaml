agileplus_version: "1.0.0"
project:
  name: "phenotype-gauge"
  description: "Metrics collection, monitoring, and telemetry for Phenotype ecosystem"
  repository: "https://github.com/KooshaPari/phenotype-gauge"
  spec_format: "yaml"

specs:
  architecture_decisions:
    - id: "adr_001"
      title: "Prometheus Metrics Export"
      status: "accepted"
    - id: "adr_002"
      title: "OpenTelemetry Tracing Integration"
      status: "accepted"
    - id: "adr_003"
      title: "Time-Series Database Backend (InfluxDB)"
      status: "accepted"
    - id: "adr_004"
      title: "Real-time Dashboard WebSocket Feed"
      status: "proposed"
  
  functional_requirements:
    - id: "fr_001"
      title: "Counter and Gauge Metrics"
      status: "implemented"
      priority: "high"
    - id: "fr_002"
      title: "Histogram and Summary Metrics"
      status: "implemented"
      priority: "high"
    - id: "fr_003"
      title: "Distributed Tracing"
      status: "implemented"
      priority: "high"
    - id: "fr_004"
      title: "Log Aggregation and Analysis"
      status: "implemented"
      priority: "medium"
    - id: "fr_005"
      title: "Alerting on Thresholds"
      status: "implemented"
      priority: "medium"
    - id: "fr_006"
      title: "Real-time Dashboard UI"
      status: "proposed"
      priority: "low"
  
  user_stories:
    - id: "us_001"
      title: "Track Application Metrics"
      status: "implemented"
      priority: "high"
    - id: "us_002"
      title: "View Distributed Traces"
      status: "implemented"
      priority: "high"
    - id: "us_003"
      title: "Receive Alert Notifications"
      status: "implemented"
      priority: "medium"

metadata:
  last_updated: "2026-04-03"
  author: "Phenotype Team"
  license: "MIT"
