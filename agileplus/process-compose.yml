version: "0.5"

# Environment variables apply to all processes
environment:
  - RUST_BACKTRACE=1
  - AGILEPLUS_API_PORT=${AGILEPLUS_API_PORT:-3000}
  - AGILEPLUS_NATS_PORT=${AGILEPLUS_NATS_PORT:-4222}
  - AGILEPLUS_NATS_HTTP_PORT=${AGILEPLUS_NATS_HTTP_PORT:-8222}
  - AGILEPLUS_REDIS_PORT=${AGILEPLUS_REDIS_PORT:-6379}
  - AGILEPLUS_POSTGRES_PORT=${AGILEPLUS_POSTGRES_PORT:-5432}
  - AGILEPLUS_NEO4J_PORT=${AGILEPLUS_NEO4J_PORT:-7687}
  - AGILEPLUS_NEO4J_HTTP_PORT=${AGILEPLUS_NEO4J_HTTP_PORT:-7474}
  - AGILEPLUS_MINIO_PORT=${AGILEPLUS_MINIO_PORT:-9000}
  - AGILEPLUS_MINIO_CONSOLE_PORT=${AGILEPLUS_MINIO_CONSOLE_PORT:-9001}
  - AGILEPLUS_PLANE_API_PORT=${AGILEPLUS_PLANE_API_PORT:-8000}
  - AGILEPLUS_PLANE_WEB_PORT=${AGILEPLUS_PLANE_WEB_PORT:-3100}
  - AGILEPLUS_WORKOS_AUTHKIT_DOMAIN=${AGILEPLUS_WORKOS_AUTHKIT_DOMAIN:-}
  - AGILEPLUS_WORKOS_CLIENT_ID=${AGILEPLUS_WORKOS_CLIENT_ID:-}
  - AGILEPLUS_WORKOS_CLIENT_SECRET=${AGILEPLUS_WORKOS_CLIENT_SECRET:-}

processes:
  # ============================================================
  # OrbStack containers: Dragonfly + PostgreSQL
  # Managed via scripts/orb-up.sh and scripts/orb-down.sh
  # ============================================================
  orb-containers:
    # orb-up.sh exits when containers are ready; keep this process alive so PC does not tear down the stack.
    command: sh -c "scripts/orb-up.sh && exec tail -f /dev/null"
    shutdown:
      command: sh scripts/orb-down.sh
    depends_on: {}
    log_location: .agileplus/logs/orb-containers.log
    readiness_probe:
      exec:
        command: sh -c "redis-cli -h localhost -p ${AGILEPLUS_REDIS_PORT:-6379} ping | grep -q PONG && pg_isready -h localhost -p ${AGILEPLUS_POSTGRES_PORT:-5432}"
      initial_delay_seconds: 5
      period_seconds: 5
      failure_threshold: 6

  # ============================================================
  # Native services
  # ============================================================
  nats:
    command: sh -c "nats-server --jetstream --store_dir .agileplus/nats-data --port ${AGILEPLUS_NATS_PORT:-4222} --http_port ${AGILEPLUS_NATS_HTTP_PORT:-8222}"
    depends_on: {}
    log_location: .agileplus/logs/nats.log
    readiness_probe:
      exec:
        command: sh -c "curl -fsS http://localhost:${AGILEPLUS_NATS_HTTP_PORT:-8222}/healthz >/dev/null"
      initial_delay_seconds: 5
      period_seconds: 5
      failure_threshold: 3
    environment:
      - NATS_LOG_FILE=.agileplus/logs/nats.log

  neo4j:
    command: sh -c "if lsof -i :${AGILEPLUS_NEO4J_PORT:-7687} >/dev/null 2>&1; then echo 'Neo4j already running, skipping start'; sleep infinity; else neo4j console; fi"
    depends_on:
      nats:
        condition: process_healthy
    log_location: .agileplus/logs/neo4j.log
    readiness_probe:
      exec:
        command: sh -c "cypher-shell -a bolt://localhost:${AGILEPLUS_NEO4J_PORT:-7687} -u neo4j -p agileplus 'RETURN 1'"
      initial_delay_seconds: 15
      period_seconds: 10
      failure_threshold: 3
    environment:
      - NEO4J_AUTH=neo4j/agileplus
      - NEO4J_HOME=.agileplus/neo4j
      - NEO4J_LOGS_DIR=.agileplus/logs
      - NEO4J_DATA_DIR=.agileplus/neo4j/data
      - NEO4J_server_bolt_listen__address=0.0.0.0:${AGILEPLUS_NEO4J_PORT:-7687}
      - NEO4J_server_bolt_advertised__address=localhost:${AGILEPLUS_NEO4J_PORT:-7687}
      - NEO4J_server_http_listen__address=0.0.0.0:${AGILEPLUS_NEO4J_HTTP_PORT:-7474}
      - NEO4J_server_http_advertised__address=localhost:${AGILEPLUS_NEO4J_HTTP_PORT:-7474}

  minio:
    command: sh -c "minio server .agileplus/minio-data --address :${AGILEPLUS_MINIO_PORT:-9000} --console-address :${AGILEPLUS_MINIO_CONSOLE_PORT:-9001}"
    depends_on:
      neo4j:
        condition: process_healthy
    log_location: .agileplus/logs/minio.log
    readiness_probe:
      exec:
        command: sh -c "curl -fsS http://localhost:${AGILEPLUS_MINIO_PORT:-9000}/minio/health/live >/dev/null"
      initial_delay_seconds: 5
      period_seconds: 5
      failure_threshold: 3
    environment:
      - MINIO_ROOT_USER=agileplus
      - MINIO_ROOT_PASSWORD=agileplus-dev
      - MINIO_LOG_DIR=.agileplus/logs
      - MINIO_LOGS_DIR=.agileplus/logs

  # ============================================================
  # Plane.so services (native Python/Node, connect to OrbStack containers)
  # ============================================================
  plane-api:
    command: sh -c "cd .agileplus/plane/apiserver && .venv/bin/python manage.py runserver 0.0.0.0:${AGILEPLUS_PLANE_API_PORT:-8000}"
    depends_on:
      orb-containers:
        condition: process_healthy
    log_location: .agileplus/logs/plane-api.log
    readiness_probe:
      exec:
        command: sh -c "curl -fsS http://localhost:${AGILEPLUS_PLANE_API_PORT:-8000}/api/health >/dev/null"
      initial_delay_seconds: 15
      period_seconds: 5
      failure_threshold: 3
    environment:
      - DATABASE_URL=postgresql://agileplus:${PLANE_POSTGRES_PASSWORD:-agileplus-dev}@localhost:${AGILEPLUS_POSTGRES_PORT:-5432}/plane
      - REDIS_URL=redis://localhost:${AGILEPLUS_REDIS_PORT:-6379}
      - SECRET_KEY=${PLANE_SECRET_KEY:-agileplus-dev-secret-key}
      - WEB_URL=http://localhost:${AGILEPLUS_PLANE_WEB_PORT:-3100}
      - CORS_ALLOWED_ORIGINS=http://localhost:${AGILEPLUS_PLANE_WEB_PORT:-3100},http://localhost:${AGILEPLUS_API_PORT:-3000}
      - PYTHONUNBUFFERED=1

  plane-web:
    command: sh -c "cd .agileplus/plane-web && npx next start -p ${AGILEPLUS_PLANE_WEB_PORT:-3100}"
    depends_on:
      plane-api:
        condition: process_healthy
    log_location: .agileplus/logs/plane-web.log
    readiness_probe:
      exec:
        command: sh -c "curl -fsS http://localhost:${AGILEPLUS_PLANE_WEB_PORT:-3100}/ >/dev/null"
      initial_delay_seconds: 20
      period_seconds: 5
      failure_threshold: 3
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:${AGILEPLUS_PLANE_API_PORT:-8000}
      - NEXT_PUBLIC_WEB_URL=http://localhost:${AGILEPLUS_PLANE_WEB_PORT:-3100}

  plane-worker:
    command: sh -c "cd .agileplus/plane/apiserver && .venv/bin/celery -A plane worker -l info"
    depends_on:
      plane-api:
        condition: process_healthy
    log_location: .agileplus/logs/plane-worker.log
    readiness_probe:
      exec:
        command: sh -c "cd .agileplus/plane/apiserver && .venv/bin/celery -A plane inspect ping | grep -q pong"
      initial_delay_seconds: 15
      period_seconds: 10
      failure_threshold: 3
    environment:
      - DATABASE_URL=postgresql://agileplus:${PLANE_POSTGRES_PASSWORD:-agileplus-dev}@localhost:${AGILEPLUS_POSTGRES_PORT:-5432}/plane
      - REDIS_URL=redis://localhost:${AGILEPLUS_REDIS_PORT:-6379}
      - SECRET_KEY=${PLANE_SECRET_KEY:-agileplus-dev-secret-key}
      - PYTHONUNBUFFERED=1

  plane-beat:
    command: sh -c "cd .agileplus/plane/apiserver && .venv/bin/celery -A plane beat -l info --pidfile=../../plane-beat.pid"
    depends_on:
      plane-api:
        condition: process_healthy
    log_location: .agileplus/logs/plane-beat.log
    readiness_probe:
      exec:
        command: test -f .agileplus/plane-beat.pid
      initial_delay_seconds: 15
      period_seconds: 10
      failure_threshold: 3
    environment:
      - DATABASE_URL=postgresql://agileplus:${PLANE_POSTGRES_PASSWORD:-agileplus-dev}@localhost:${AGILEPLUS_POSTGRES_PORT:-5432}/plane
      - REDIS_URL=redis://localhost:${AGILEPLUS_REDIS_PORT:-6379}
      - SECRET_KEY=${PLANE_SECRET_KEY:-agileplus-dev-secret-key}
      - PYTHONUNBUFFERED=1

  # ============================================================
  # AgilePlus API (native Rust)
  # ============================================================
  agileplus-api:
    command: cargo run --release -p agileplus-api
    depends_on:
      nats:
        condition: process_healthy
      orb-containers:
        condition: process_healthy
      neo4j:
        condition: process_healthy
      minio:
        condition: process_healthy
      plane-web:
        condition: process_healthy
    log_location: .agileplus/logs/agileplus-api.log
    readiness_probe:
      exec:
        command: sh -c "curl -fsS http://localhost:${AGILEPLUS_API_PORT:-3000}/health >/dev/null"
      initial_delay_seconds: 30
      period_seconds: 5
      failure_threshold: 5
    environment:
      - RUST_LOG=info,agileplus=debug
      - NATS_URL=nats://localhost:${AGILEPLUS_NATS_PORT:-4222}
      - DRAGONFLY_URL=redis://localhost:${AGILEPLUS_REDIS_PORT:-6379}
      - NEO4J_URI=bolt://localhost:${AGILEPLUS_NEO4J_PORT:-7687}
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=agileplus
      - MINIO_ENDPOINT=http://localhost:${AGILEPLUS_MINIO_PORT:-9000}
      - MINIO_ACCESS_KEY=agileplus
      - MINIO_SECRET_KEY=agileplus-dev
      - MINIO_REGION=us-east-1
      - DATABASE_URL=sqlite:.agileplus/agileplus.db
      - API_PORT=${AGILEPLUS_API_PORT:-3000}
      - API_HOST=0.0.0.0
      - PLANE_API_URL=http://localhost:${AGILEPLUS_PLANE_API_PORT:-8000}
      - AUTHKIT_DOMAIN=${AGILEPLUS_WORKOS_AUTHKIT_DOMAIN:-}
      - WORKOS_CLIENT_ID=${AGILEPLUS_WORKOS_CLIENT_ID:-}
      - WORKOS_CLIENT_SECRET=${AGILEPLUS_WORKOS_CLIENT_SECRET:-}
