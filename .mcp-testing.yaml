# Cross-Project AI Testing Orchestration via MCP
# Model Context Protocol for AI Testing Infrastructure

name: "Phenotype AI Testing Mesh"
version: "1.0.0"

# MCP Server Configuration for Cross-Project Testing
mcp_servers:
  # NanoVMS VM Testing MCP
  nanovms:
    command: "npx"
    args: ["-y", "@nanovms/mcp-server"]
    env:
      NANOVMS_API_URL: "http://localhost:8080"
    capabilities:
      - vm_lifecycle
      - sandbox_execution
      - tier_isolation

  # AgilePlus Spec-Driven Testing MCP
  agileplus:
    command: "agileplus"
    args: ["mcp", "server"]
    env:
      AGILEPLUS_BASE_URL: "http://localhost:8000"
    capabilities:
      - spec_validation
      - fr_traceability
      - bidirectional_sync

  # thegent Agent Testing MCP
  thegent:
    command: "thegent"
    args: ["mcp", "server"]
    env:
      THEGENT_API_URL: "http://localhost:9000"
    capabilities:
      - agent_behavior
      - conversation_testing
      - tui_visual

# Cross-Project Test Orchestration
orchestration:
  test_order:
    - project: "nanovms"
      tests: ["unit", "integration"]
    - project: "agileplus"
      tests: ["spec", "integration"]
    - project: "thegent"
      tests: ["agent", "e2e"]

  # AI Test Generation Pipeline
  pipeline:
    - name: "Generate Tests"
      agent: "qodo"
      output: "tests/generated"
    - name: "Self-Healing"
      agent: "testrigor"
      triggers: ["failure_rate > 0.3"]
    - name: "Visual Validation"
      agent: "applitools"
      targets: ["dashboard", "tui"]

# Shared Test Infrastructure
shared:
  fixtures:
    - name: "clean_project"
      cleanup: "rm -rf ./**/node_modules ./**/target"
    - name: "test_credentials"
      source: "vault://testing/credentials"

  reporting:
    format: "json"
    output: "test-results/"
    aggregate: true

# Environment Variables
env:
  TEST_TIMEOUT: "300"
  RETRY_ATTEMPTS: "3"
  PARALLEL_WORKERS: "4"
