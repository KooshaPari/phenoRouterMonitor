[package]
name = "phenotype-policy-engine"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
dashmap = "5"
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
