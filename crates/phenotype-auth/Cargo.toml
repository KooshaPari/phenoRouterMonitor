[package]
name = "phenotype-auth"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Authentication and authorization shared abstractions for the Phenotype ecosystem"
repository = "https://github.com/kooshr/phenotype"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jsonwebtoken = "9"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
