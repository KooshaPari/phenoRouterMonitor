[package]
name = "phenotype-event-sourcing"
version = "0.2.0"
edition = "2021"
authors = ["Phenotype Team"]
license = "MIT"
description = "Event sourcing with SHA-256 hash chains"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
dashmap = "5"
parking_lot = "0.12"
