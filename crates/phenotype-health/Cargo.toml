[package]
name = "phenotype-health"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Shared health check abstraction for Phenotype services"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
