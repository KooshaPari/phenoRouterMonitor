[package]
name = "phenotype-process"
version.workspace = true
edition = "2021"
description = "Cross-platform process and PTY management for Phenotype"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { workspace = true, features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
portable-pty = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints.rust]
unsafe_code = "forbid"
