[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
authors = ["Phenotype Team"]
description = "Phenotype Platform - Generic Parent Workspace"

[workspace]
resolver = "2"
members = [
    # Phenotype shared crates (from repos/crates/)
    "crates/phenotype-async-traits",
    "crates/phenotype-cache-adapter",
    # "crates/phenotype-casbin-wrapper",  # TODO: fix missing casbin dependency
    "crates/phenotype-contract",
    "crates/phenotype-contracts",
    "crates/phenotype-error-core",
    "crates/phenotype-error-macros",
    "crates/phenotype-errors",
    "crates/phenotype-event-sourcing",
    "crates/phenotype-health",
    "crates/phenotype-iter",
    "crates/phenotype-logging",
    # "crates/phenotype-policy-engine",  # TODO: depends on casbin-wrapper
    "crates/phenotype-port-traits",
    "crates/phenotype-state-machine",
    # "crates/phenotype-string",  # TODO: fix missing compression/normalization modules
    "crates/phenotype-telemetry",
    "crates/phenotype-validation",
    # Cross-platform crates
    "crates/platform-commons",
]

exclude = [
    "crates/phenotype-casbin-wrapper",
    "crates/phenotype-policy-engine",
    "crates/phenotype-string",
]

[workspace.dependencies]
# Shared dependencies across all platforms
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Phenotype-specific
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
lru = "0.12"
parking_lot = "0.12"
strum = { version = "0.26", features = ["derive"] }
once_cell = "1.19"
blake3 = "1"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
regex = "1"
tempfile = "3"
futures = "0.3"
async-trait = "0.1"
dirs = "5"
zstd = "0.13"
unicode-normalization = "0.1"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
