---
adr_id: adr_003
title: "TypeScript SDK Code Generation"
status: "accepted"
date: "2026-04-03"
author: "Phenotype Team"
context: |
  TypeScript developers need type-safe access to the Rust core functionality.
  Manually maintaining TypeScript definitions is error-prone and
  quickly becomes out of sync with the Rust implementation.
decision: |
  Use ts-rs for automatic TypeScript type generation from Rust structs.
  This ensures type definitions always match the Rust implementation
  and eliminates manual maintenance overhead.
consequences:
  positive:
    - "Type definitions always synchronized with Rust"
    - "Compile-time type checking across language boundary"
    - "IDE autocomplete support for TypeScript users"
    - "Reduced maintenance burden"
  negative:
    - "Build-time dependency on ts-rs"
    - "Some Rust types may require manual TypeScript mapping"
    - "Additional build step in CI/CD"
alternatives:
  - title: "Manual Type Definitions"
    status: "rejected"
    reason: "Maintenance burden and synchronization risk"
  - title: "JSON Schema + Quicktype"
    status: "rejected"
    reason: "Adds complexity, ts-rs is simpler for Rust projects"
related_frs:
  - "fr_003"
related_us:
  - "us_003"
