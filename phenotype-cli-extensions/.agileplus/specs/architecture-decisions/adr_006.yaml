---
adr_id: adr_006
title: "Desktop Notifications"
status: "proposed"
date: "2026-04-03"
author: "Phenotype Team"
context: |
  CLI applications may need to notify users when long-running tasks
  complete or when user attention is required. Desktop notifications
  provide this capability without breaking the CLI flow.
decision: |
  [PROPOSED] Implement cross-platform desktop notification support using
  notify-rust. This will allow CLI applications to show native
  notifications on macOS, Linux, and Windows.
consequences:
  positive:
    - "Native notifications on all platforms"
    - "Non-intrusive user alerts"
    - "Integration with system notification centers"
    - "Configurable notification behavior"
  negative:
    - "Additional dependency on notify-rust"
    - "Platform-specific permission requirements"
    - "Potential for notification spam if misused"
alternatives:
  - title: "Terminal Bell"
    status: "rejected"
    reason: "Limited effectiveness, often disabled"
  - title: "OSC 9/777 Notifications"
    status: "under_consideration"
    reason: "Terminal-dependent, less feature-rich"
related_frs:
  - "fr_006"
related_us:
  - "us_006"
