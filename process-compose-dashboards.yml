# Process Compose - All Dashboards
# Run: process-compose -f process-compose-dashboards.yml up -d

version: "0.5"

processes:
  # 1. AgilePlus Native Dashboard
  agileplus-dashboard:
    command: ./target/debug/agileplus-dashboard
    working_dir: /Users/kooshapari/CodeProjects/Phenotype/repos/AgilePlus
    availability:
      restart: on_failure
      max_restarts: 3
    ports:
      - "3000:3000"
    environment:
      - "RUST_LOG=info"

  # 2. Unified Health Dashboard (phenotype-infrakit)
  health-dashboard:
    command: cargo run --bin dashboard-server -- --port 3001 --root /Users/kooshapari/CodeProjects/Phenotype/repos
    working_dir: /Users/kooshapari/CodeProjects/Phenotype/repos/phenotype-infrakit
    availability:
      restart: on_failure
      max_restarts: 3
    ports:
      - "3001:3001"
    environment:
      - "RUST_LOG=info"

  # 3. Planify (Plane Fork) - Web
  planify-web:
    command: docker-compose up
    working_dir: /Users/kooshapari/CodeProjects/Phenotype/repos/Planify
    availability:
      restart: "no"
    ports:
      - "8080:8080"

