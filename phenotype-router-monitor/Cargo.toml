[workspace]
members = [
    "crates/phenotype-monitor-contracts",
    "crates/phenotype-router",
    "crates/phenotype-metrics",
    "crates/phenotype-meter",
    "crates/phenotype-monitor-cli",
    "crates/phenotype-monitor-api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Phenotype Team <team@phenotype.dev>"]
repository = "https://github.com/KooshaPari/phenotype-infrakit"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1.41", features = ["full"] }
dashmap = "6"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
pyo3 = { version = "0.24", optional = true }

# Testing & benchmarking
criterion = "0.5"
proptest = "1"
