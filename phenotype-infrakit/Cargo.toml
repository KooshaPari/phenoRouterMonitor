[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
authors = ["Phenotype Team"]

[workspace]
resolver = "2"
members = [
    "crates/phenotype-analytics",
    "crates/phenotype-bdd",
    "crates/phenotype-config-core",
    "crates/phenotype-contract-tests",
    "crates/phenotype-contracts",
    "crates/phenotype-crypto",
    "crates/phenotype-fs",
    "crates/phenotype-git-core",
    "crates/phenotype-health",
    "crates/phenotype-http-client",
    "crates/phenotype-jsonl",
    "crates/phenotype-mock",
    "crates/phenotype-observability",
    "crates/phenotype-project-registry",
    "crates/phenotype-rate-limiter",
    "crates/phenotype-resources",
    "crates/phenotype-security-aggregator",
    "crates/phenotype-sentry-config",
    "crates/phenotype-testing",
    "crates/phenotype-utils",
    "crates/phenotype-validation",
]

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
axum = { version = "0.7", features = ["tokio"] }
tower = "0.4"
toml = "0.8"
dashmap = "5"
once_cell = "1.19"
mockall = "0.12"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
http = "1"
hyper = { version = "1", features = ["full"] }
sentry = { version = "0.35", features = ["backtrace"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = "z"
lto = true
