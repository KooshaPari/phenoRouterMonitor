[workspace]
resolver = "2"
members = [
    "crates/phenotype-bdd",
    "crates/phenotype-compliance-scanner",
    "crates/phenotype-config-core",
    "crates/phenotype-health",
    "crates/phenotype-project-registry",
    "crates/phenotype-rate-limiter",
    "crates/phenotype-security-aggregator",
    "crates/phenotype-testing",
    "crates/phenotype-validation",
]
# ═══════════════════════════════════════════════════════════════════════════
# PHENOTYPE INFRAKIT - CANONICAL DEPENDENCY VERSIONS
# Standard versions for phenotype infrastructure crates
# ═══════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────
# Core Async Runtime
# ─────────────────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
futures-util = "0.3"

# ─────────────────────────────────────────────────────────────────────────
# Error Handling
# ─────────────────────────────────────────────────────────────────────────
thiserror = "2.0"
anyhow = "1.0"

# ─────────────────────────────────────────────────────────────────────────
# Serialization (JSON, TOML, YAML)
# ─────────────────────────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
serde_yaml_ng = "0.10"

# ─────────────────────────────────────────────────────────────────────────
# HTTP & Web
# ─────────────────────────────────────────────────────────────────────────
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
hyper = { version = "1.0", features = ["client", "server"] }
axum = "0.7"
http = "1.0"
http-body = "1.0"
http-body-util = "0.1"
url = "2.5"

# ─────────────────────────────────────────────────────────────────────────
# Validation
# ─────────────────────────────────────────────────────────────────────────
jsonschema = "0.17"
schemars = "0.8"
validator = { version = "0.16", features = ["derive"] }

# ─────────────────────────────────────────────────────────────────────────
# Logging & Tracing
# ─────────────────────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# ─────────────────────────────────────────────────────────────────────────
# Time & Date
# ─────────────────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde"] }

# ─────────────────────────────────────────────────────────────────────────
# Utilities
# ─────────────────────────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "5"
bytes = "1"
glob = "0.3"
regex = "1.10"
base64 = "0.22"
dirs = "5"
walkdir = "2.5"

# ─────────────────────────────────────────────────────────────────────────
# Error Tracking & Observability
# ─────────────────────────────────────────────────────────────────────────
sentry = { version = "0.32", features = ["backtrace"] }

# ─────────────────────────────────────────────────────────────────────────
# Testing
# ─────────────────────────────────────────────────────────────────────────
tempfile = "3"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
fake = { version = "3.0", features = ["derive"] }
tokio-test = "0.4"
tokio-retry = "0.3"
mockall = "0.12"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Phenotype infrastructure crate library"
repository = "https://github.com/phenotype-dev/phenotype-infrakit"
authors = ["Phenotype Team"]
rust-version = "1.75"
