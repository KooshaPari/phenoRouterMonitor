[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
authors = ["Phenotype Team"]
repository = "https://github.com/phenotype-dev/phenotype-infrakit"

[workspace]
resolver = "2"
members = [
    "crates/phenotype-bdd",
    "crates/phenotype-config-core",
    "crates/phenotype-contract-tests",
    "crates/phenotype-http-client",
    "crates/phenotype-rate-limiter",
    "crates/phenotype-sentry-config",
    "crates/phenotype-testing",
    "crates/phenotype-observability",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
axum = { version = "0.7", features = ["tokio"] }
tower = "0.4"
reqwest = { version = "0.12", features = ["json"] }
sentry = { version = "0.32", features = ["debug-images"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = "z"
lto = true
