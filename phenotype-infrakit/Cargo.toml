[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
authors = ["Phenotype Team"]
repository = "https://github.com/phenotype-dev/phenotype-infrakit"

[workspace]
resolver = "2"
members = [
    "crates/agileplus-dashboard",
    "crates/agileplus-dashboard-server",
    "crates/phenotype-compliance-scanner",
    "crates/phenotype-health",
    "crates/phenotype-project-registry",
    "crates/phenotype-security-aggregator",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
axum = { version = "0.7", features = ["tokio"] }
tower = "0.4"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = "z"
lto = true
