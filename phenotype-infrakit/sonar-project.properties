# SonarCloud Configuration
# SonarCloud URL: https://sonarcloud.io
# Organization: stealth-startup-3u

sonar.projectKey=KooshaPari_phenotype-infrakit
sonar.organization=KooshaPari
sonar.projectName=phenotype-infrakit
sonar.projectVersion=1.0.0

# Sources
sonar.sources=crates
sonar.exclusions=**/*.lock,**/target/**,**/.git/**,**/node_modules/**

# Language
sonar.language=rust
sonar.rust.includetests=true

# Coverage
sonar.coverage.jacoco.xmlReportsPath=coverage/

# Pull Request Analysis
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=KooshaPari/phenotype-infrakit

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
