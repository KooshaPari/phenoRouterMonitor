name: Security Checks
description: Runs security scanning tools.

inputs:
  cargo-audit:
    description: Run cargo-audit
    default: "true"
    required: false
  cargo-deny:
    description: Run cargo-deny
    default: "true"
    required: false
  cargo-deny-config:
    description: Cargo deny config path
    default: ""
    required: false
  gitleaks:
    description: Run gitleaks
    default: "true"
    required: false
  python-bandit:
    description: Run bandit
    default: "false"
    required: false
  bandit-path:
    description: Path for bandit scan
    default: python/src
    required: false
  working-directory:
    description: Working directory
    default: .
    required: false

runs:
  using: composite
  steps:
    - name: Cargo audit
      if: inputs.cargo-audit == 'true'
      uses: rustsec/audit-check@v2.0.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Cargo deny
      if: inputs.cargo-deny == 'true'
      shell: bash
      run: |
        cd ${{ inputs.working-directory }}
        cargo install cargo-deny
        if [ "${{ inputs.cargo-deny-config }}" != "" ]; then
          cargo deny check -c ${{ inputs.cargo-deny-config }}
        else
          cargo deny check
        fi

    - name: Gitleaks
      if: inputs.gitleaks == 'true'
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Bandit
      if: inputs.python-bandit == 'true'
      shell: bash
      run: |
        pip install bandit || true
        bandit -r ${{ inputs.bandit-path }} -ll || true
